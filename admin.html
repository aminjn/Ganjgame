<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>بازی گنج — پنل ادمین</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%234fd6ff%27/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/ui/style.css" />
  <style>
    html, body { overflow: auto; height: auto; }
    .page { max-width: 1000px; margin: 0 auto; padding: 12px 14px 40px; }
    h1 { color: var(--cyan); font-size: 18px; margin: 6px 0 10px; }
    .lockbar { padding: 8px 12px; border-radius: 10px; margin-bottom: 10px; font-weight: 700; }
    .lockbar.open { background: #17402a; color: var(--green); }
    .lockbar.locked { background: #4a2620; color: #ffb3a7; }
    nav.atabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    nav.atabs button.active { background: #1b3a45; border-color: var(--cyan); color: var(--cyan); }
    .field { display: grid; grid-template-columns: 1.3fr 110px 70px 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 12.5px; }
    .field input { padding: 5px 8px; }
    .field .hint { color: var(--muted); font-size: 11.5px; }
    .field .err { color: var(--red); font-size: 11.5px; grid-column: 1 / -1; }
    .field .remind { color: #9a927f; font-size: 11.5px; grid-column: 1 / -1; }
    .maps { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
    .map { background: var(--panel2); border: 2px solid var(--line); border-radius: 12px; padding: 8px; cursor: pointer; }
    .map.sel { border-color: var(--cyan); }
    .map canvas { width: 100%; aspect-ratio: 1; image-rendering: pixelated; border-radius: 6px; display: block; }
    .map .shares { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.7; }
    pre { direction: ltr; text-align: left; background: #0e0b08; padding: 10px; border-radius: 8px; overflow: auto; font-size: 12px; }
    @media (max-width: 640px) { .field { grid-template-columns: 1fr 100px 60px; } .field .hint, .field .def { display: none; } }
  </style>
</head>
<body>
  <div class="page">
    <h1>پنل ادمین بازی گنج</h1>
    <div id="lockbar" class="lockbar"></div>
    <nav class="atabs" id="atabs"></nav>
    <div id="content"></div>
  </div>
  <script type="module" src="/src/admin.ts"></script>
</body>
</html>
